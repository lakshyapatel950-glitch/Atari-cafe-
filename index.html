  <title>Atari Cafe | Bankhedi</title>

  <meta name="description" content="Atari Cafe, Bankhedi - Good Food, Great Vibes, Good Times. Explore our vegetarian menu and order online.">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#0b0b0b;
      color:#fff;
      line-height:1.6;
    }

    :root{
      --gold:#d6a85f;
      --gold-light:#f0c982;
      --dark:#0b0b0b;
      --card:#151515;
      --border:#333;
    }

    .hero{
      min-height:88vh;
      display:flex;
      align-items:center;
      padding:50px 7%;
      background:
        linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.35)),
        url("photo1.jpg") center/cover no-repeat;
    }

    .hero-content{
      max-width:720px;
      animation:fadeUp 1s ease;
    }

    .badge{
      display:inline-block;
      padding:8px 16px;
      border:1px solid var(--gold);
      border-radius:30px;
      color:var(--gold);
      font-weight:bold;
      margin-bottom:20px;
      letter-spacing:2px;
    }

    .hero h1{
      font-size:clamp(52px,10vw,105px);
      line-height:.95;
      letter-spacing:6px;
      margin-bottom:20px;
    }

    .hero h1 span{
      color:var(--gold);
    }

    .hero p{
      font-size:20px;
      color:#eee;
      margin-bottom:28px;
      letter-spacing:2px;
    }

    .btn{
      display:inline-block;
      padding:14px 24px;
      border-radius:30px;
      text-decoration:none;
      font-weight:bold;
      margin:5px;
      cursor:pointer;
      border:1px solid var(--gold);
      background:var(--gold);
      color:#111;
      transition:.25s;
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 25px rgba(214,168,95,.3);
    }

    .btn.dark{
      background:transparent;
      color:#fff;
    }

    nav{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(10,10,10,.96);
      border-bottom:1px solid #333;
      padding:16px;
      text-align:center;
      backdrop-filter:blur(10px);
    }

    nav a{
      color:#fff;
      text-decoration:none;
      margin:0 14px;
      font-weight:bold;
      font-size:15px;
    }

    nav a:hover{
      color:var(--gold);
    }

    section{
      max-width:1150px;
      margin:auto;
      padding:75px 20px;
    }

    .title{
      text-align:center;
      font-size:40px;
      margin-bottom:8px;
    }

    .subtitle{
      text-align:center;
      color:#aaa;
      max-width:650px;
      margin:0 auto 25px;
    }

    .line{
      width:70px;
      height:3px;
      background:var(--gold);
      margin:0 auto 40px;
    }

    .about-box{
      background:linear-gradient(145deg,#181818,#101010);
      border:1px solid var(--border);
      border-radius:24px;
      padding:38px;
      text-align:center;
      font-size:18px;
      color:#ddd;
    }

    .features{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
      margin-top:30px;
    }

    .feature{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:28px;
      text-align:center;
      transition:.3s;
    }

    .feature:hover{
      transform:translateY(-6px);
      border-color:var(--gold);
    }

    .feature-icon{
      font-size:38px;
      margin-bottom:12px;
    }

    .feature h3{
      color:var(--gold);
      margin-bottom:8px;
    }

    .menu-board{
      width:100%;
      max-width:950px;
      display:block;
      margin:0 auto 35px;
      border-radius:20px;
      border:1px solid #444;
    }

    .categories{
      display:flex;
      gap:10px;
      overflow:auto;
      padding:5px 0 20px;
      white-space:nowrap;
    }

    .categories button{
      background:#171717;
      color:#fff;
      border:1px solid #444;
      border-radius:25px;
      padding:11px 18px;
      cursor:pointer;
    }

    .categories button:hover{
      background:var(--gold);
      color:#111;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:18px;
    }

    .menu-card{
      background:linear-gradient(145deg,#191919,#111);
      border:1px solid #333;
      border-radius:20px;
      padding:20px;
      transition:.3s;
    }

    .menu-card:hover{
      transform:translateY(-4px);
      border-color:var(--gold);
    }

    .menu-card h3{
      color:var(--gold);
      font-size:24px;
      margin-bottom:10px;
    }

    .item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border-top:1px solid #292929;
      padding:13px 0;
    }

    .item:first-of-type{
      border-top:0;
    }

    .price{
      font-weight:bold;
      white-space:nowrap;
    }

    .add{
      background:var(--gold);
      color:#111;
      border:0;
      border-radius:20px;
      padding:7px 12px;
      font-weight:bold;
      cursor:pointer;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:18px;
    }

    .gallery img{
      width:100%;
      height:270px;
      object-fit:cover;
      border-radius:20px;
      border:1px solid #333;
    }

    .gallery .wide{
      grid-column:1/-1;
      height:auto;
      max-height:600px;
      object-fit:contain;
      background:#111;
    }

    .info{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:18px;
    }

    .card{
      background:linear-gradient(145deg,#191919,#111);
      border:1px solid #333;
      border-radius:22px;
      padding:30px;
      text-align:center;
    }

    .card h3{
      color:var(--gold);
      margin-bottom:12px;
      font-size:23px;
    }

    .order-box{
      background:linear-gradient(
        135deg,
        rgba(214,168,95,.14),
        rgba(255,255,255,.02)
      );
      border:1px solid #55452d;
      border-radius:25px;
      padding:40px;
      text-align:center;
    }

    .order-box h3{
      font-size:28px;
      margin-bottom:10px;
    }

    .cart{
      position:fixed;
      right:18px;
      bottom:18px;
      background:var(--gold);
      color:#111
